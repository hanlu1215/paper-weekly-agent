name: Test WeChat Publish

# 仅发布已有 daily_reports/*.md 到公众号，不跑文献检索
on:
  workflow_dispatch:
    inputs:
      report_path:
        description: "日报 .md 路径（相对仓库根）"
        required: false
        default: "daily_reports/2026-05-20-文献每日速递.md"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Publish to WeChat via cloud hosting
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO_BRANCH: ${{ github.ref_name }}
          WECHAT_CLOUD_PUBLISH_URL: ${{ secrets.WECHAT_CLOUD_PUBLISH_URL }}
          WECHAT_CLOUD_PUBLISH_TOKEN: ${{ secrets.WECHAT_CLOUD_PUBLISH_TOKEN }}
          WECHAT_CLOUD_COVER_IMAGE: ${{ vars.WECHAT_CLOUD_COVER_IMAGE }}
          WECHAT_CLOUD_AUTHOR: ${{ vars.WECHAT_CLOUD_AUTHOR }}
          WECHAT_CLOUD_DIGEST: ${{ vars.WECHAT_CLOUD_DIGEST }}
          WECHAT_CLOUD_CONTENT_SOURCE_URL: ${{ vars.WECHAT_CLOUD_CONTENT_SOURCE_URL }}
        run: |
          REPORT="${{ inputs.report_path }}"
          if [ ! -f "$REPORT" ]; then
            echo "::error::日报文件不存在: $REPORT"
            exit 1
          fi
          python3 scripts/test_wechat_publish.py "$REPORT"
