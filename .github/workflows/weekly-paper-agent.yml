name: Daily Paper Agent

on:
  schedule:
    # 每天北京时间 09:00（UTC+8，无夏令时）= UTC 01:00；仅对仓库默认分支 main 触发
    - cron: "0 1 * * *"
  workflow_dispatch:

# 定时任务仅在 main 上执行；避免并发重复推送
concurrency:
  group: daily-paper-agent-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-paper-agent:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      REPORT_TIMEZONE: Asia/Shanghai

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run paper agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          IEEE_XPLORE_API_KEY: ${{ secrets.IEEE_XPLORE_API_KEY }}
          SKIP_FEISHU_NOTIFY: "true"
          PYTHONUNBUFFERED: "1"
          MAX_PAPERS_TO_SUMMARIZE: "20"
          MAX_RESULTS_PER_SOURCE: "30"
          ARXIV_REQUEST_TIMEOUT: "60"
          ARXIV_MAX_RETRIES: "4"
          ARXIV_KEYWORD_DELAY: "5"
          ARXIV_COOLDOWN_SECONDS: "3"
          ARXIV_TOTAL_TIMEOUT_SECONDS: "600"
          ARXIV_BULK_QUERY_MAX_KEYWORDS: "0"
          SEMANTIC_SCHOLAR_TOTAL_TIMEOUT_SECONDS: "120"
          OPENREVIEW_TOTAL_TIMEOUT_SECONDS: "120"
          IEEE_XPLORE_TOTAL_TIMEOUT_SECONDS: "120"
          DEEPSEEK_TIMEOUT: "90"
        run: python3 -u src/main.py

      - name: Commit and push daily report to main
        run: |
          BRANCH="main"

          sync_from_remote() {
            git fetch origin "$BRANCH"
            if git pull --rebase origin "$BRANCH"; then
              return 0
            fi
            echo "Rebase failed, trying merge with origin/$BRANCH..."
            git rebase --abort 2>/dev/null || true
            git pull origin "$BRANCH" --no-edit
          }

          push_with_retry() {
            local attempt=1
            local delay=10
            while true; do
              sync_from_remote
              if git push origin "HEAD:${BRANCH}"; then
                return 0
              fi
              if [ "$attempt" -ge 5 ]; then
                echo "git push failed after $attempt attempts."
                return 1
              fi
              echo "git push failed; pull and retry in ${delay}s (attempt $attempt/5)..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p daily_reports daily_cumulative
          git add daily_reports/*.md daily_cumulative/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new or updated daily report to commit."
          else
            git commit -m "chore: update daily paper report $(date +%Y-%m-%d)"
            push_with_retry
          fi

      - name: Validate Feishu wiki secrets
        if: success()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_WIKI_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_PARENT_NODE_TOKEN }}
          FEISHU_WIKI_BASE_URL: ${{ secrets.FEISHU_WIKI_BASE_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          missing=0
          [ -z "$FEISHU_APP_ID" ] && echo "::error::缺少 Secret: FEISHU_APP_ID" && missing=1
          [ -z "$FEISHU_APP_SECRET" ] && echo "::error::缺少 Secret: FEISHU_APP_SECRET" && missing=1
          if [ -z "$FEISHU_WIKI_SPACE_ID" ] && [ -z "$FEISHU_WIKI_PARENT_NODE_TOKEN" ]; then
            echo "::error::缺少 FEISHU_WIKI_SPACE_ID 或 FEISHU_WIKI_PARENT_NODE_TOKEN（至少填一个）"
            missing=1
          fi
          [ -z "$FEISHU_WEBHOOK_URL" ] && echo "::error::缺少 Secret: FEISHU_WEBHOOK_URL" && missing=1
          if [ "$missing" -ne 0 ]; then exit 1; fi
          python3 scripts/verify_feishu_wiki.py

      - name: Send daily report to Feishu
        if: success()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO_BRANCH: main
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_WIKI_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_PARENT_NODE_TOKEN }}
          FEISHU_WIKI_BASE_URL: ${{ secrets.FEISHU_WIKI_BASE_URL }}
          FEISHU_NOTIFY_MODE: wiki_link
        run: |
          TODAY=$(date +%Y-%m-%d)
          LATEST="daily_reports/${TODAY}-文献每日速递.md"
          if [ ! -f "$LATEST" ]; then
            echo "未找到今日日报 ${LATEST}，跳过飞书推送。"
            exit 0
          fi
          if grep -q "今日无新增文献" "$LATEST"; then
            echo "今日无新增文献，跳过飞书推送。"
            exit 0
          fi
          python3 src/send_to_feishu.py "$LATEST"
