name: Weekly Paper Agent

on:
  schedule:
    # 每周一 08:00（北京时间 UTC+8）≈ UTC 周日 00:00
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-paper-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SKIP_FEISHU_NOTIFY: "true"
        run: python src/main.py

      - name: Commit and push weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add output/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new or updated report to commit."
          else
            git commit -m "chore: update weekly paper report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send report to Feishu
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python src/send_to_feishu.py
