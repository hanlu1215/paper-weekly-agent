name: Daily Paper Agent

on:
  schedule:
    # 每天 09:00（北京时间 UTC+8）= UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-paper-agent:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Configure Git network
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checkout_with_retry() {
            local attempt=1
            local delay=10
            while true; do
              if git -c http.version=HTTP/1.1 fetch --depth=1 --no-tags origin "$GITHUB_SHA"; then
                return 0
              fi
              if [ "$attempt" -ge 5 ]; then
                echo "git fetch failed after $attempt attempts."
                return 1
              fi
              echo "git fetch failed; retrying in ${delay}s (attempt $attempt/5)..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          shopt -s dotglob nullglob
          rm -rf -- *
          shopt -u dotglob nullglob
          git init
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          checkout_with_retry
          git checkout --force -B "$GITHUB_REF_NAME" FETCH_HEAD
          git branch --set-upstream-to="origin/$GITHUB_REF_NAME" "$GITHUB_REF_NAME" || true

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run paper agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          IEEE_XPLORE_API_KEY: ${{ secrets.IEEE_XPLORE_API_KEY }}
          SKIP_FEISHU_NOTIFY: "true"
          PYTHONUNBUFFERED: "1"
          MAX_RESULTS_PER_SOURCE: "30"
          ARXIV_REQUEST_TIMEOUT: "20"
          ARXIV_MAX_RETRIES: "2"
          ARXIV_TOTAL_TIMEOUT_SECONDS: "180"
          SEMANTIC_SCHOLAR_TOTAL_TIMEOUT_SECONDS: "120"
          OPENREVIEW_TOTAL_TIMEOUT_SECONDS: "120"
          IEEE_XPLORE_TOTAL_TIMEOUT_SECONDS: "120"
          DEEPSEEK_TIMEOUT: "60"
        run: python3 -u src/main.py

      - name: Commit and push weekly report
        run: |
          push_with_retry() {
            local attempt=1
            local delay=10
            while true; do
              if git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
                return 0
              fi
              if [ "$attempt" -ge 5 ]; then
                echo "git push failed after $attempt attempts."
                return 1
              fi
              echo "git push failed; retrying in ${delay}s (attempt $attempt/5)..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p daily_reports weekly_reports
          git add daily_reports/*.md weekly_reports/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new or updated report to commit."
          else
            git commit -m "chore: update paper report $(date -u +%Y-%m-%d)"
            push_with_retry
          fi

      - name: Validate Feishu wiki secrets
        if: success()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_WIKI_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_PARENT_NODE_TOKEN }}
          FEISHU_WIKI_BASE_URL: ${{ secrets.FEISHU_WIKI_BASE_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          missing=0
          [ -z "$FEISHU_APP_ID" ] && echo "::error::缺少 Secret: FEISHU_APP_ID" && missing=1
          [ -z "$FEISHU_APP_SECRET" ] && echo "::error::缺少 Secret: FEISHU_APP_SECRET" && missing=1
          if [ -z "$FEISHU_WIKI_SPACE_ID" ] && [ -z "$FEISHU_WIKI_PARENT_NODE_TOKEN" ]; then
            echo "::error::缺少 FEISHU_WIKI_SPACE_ID 或 FEISHU_WIKI_PARENT_NODE_TOKEN（至少填一个）"
            missing=1
          fi
          [ -z "$FEISHU_WEBHOOK_URL" ] && echo "::error::缺少 Secret: FEISHU_WEBHOOK_URL" && missing=1
          if [ "$missing" -ne 0 ]; then exit 1; fi
          python3 scripts/verify_feishu_wiki.py

      - name: Send report to Feishu
        if: success()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO_BRANCH: ${{ github.ref_name }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_WIKI_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_PARENT_NODE_TOKEN }}
          FEISHU_WIKI_BASE_URL: ${{ secrets.FEISHU_WIKI_BASE_URL }}
          FEISHU_NOTIFY_MODE: wiki_link
        run: |
          LATEST=$(ls -t daily_reports/*-文献每日速递*.md 2>/dev/null | head -1 || true)
          if [ -z "$LATEST" ]; then
            echo "daily_reports/ 下无速递文件，跳过飞书推送。"
            exit 0
          fi
          if grep -q "今日无新增文献" "$LATEST"; then
            echo "今日无新增文献，跳过飞书推送。"
            exit 0
          fi
          python3 src/send_to_feishu.py "$LATEST"

      - name: Send report to WeChat Official Account
        if: success()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO_BRANCH: ${{ github.ref_name }}
          WECHAT_MP_APP_ID: ${{ secrets.WECHAT_MP_APP_ID }}
          WECHAT_MP_APP_SECRET: ${{ secrets.WECHAT_MP_APP_SECRET }}
          WECHAT_MP_THUMB_MEDIA_ID: ${{ secrets.WECHAT_MP_THUMB_MEDIA_ID }}
          WECHAT_MP_COVER_IMAGE: ${{ vars.WECHAT_MP_COVER_IMAGE }}
          WECHAT_MP_AUTHOR: ${{ vars.WECHAT_MP_AUTHOR }}
          WECHAT_MP_DIGEST: ${{ vars.WECHAT_MP_DIGEST }}
          WECHAT_MP_CONTENT_SOURCE_URL: ${{ vars.WECHAT_MP_CONTENT_SOURCE_URL }}
        run: |
          LATEST=$(ls -t daily_reports/*-文献每日速递*.md 2>/dev/null | head -1 || true)
          if [ -z "$LATEST" ]; then
            echo "daily_reports/ 下无速递文件，跳过公众号群发。"
            exit 0
          fi
          if grep -q "今日无新增文献" "$LATEST"; then
            echo "今日无新增文献，跳过公众号群发。"
            exit 0
          fi
          echo "GitHub Actions public IP: $(curl -fsS https://api.ipify.org || true)"
          python3 src/send_to_wechat_mp.py "$LATEST"
