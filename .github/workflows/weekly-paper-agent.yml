name: Daily Paper Agent

on:
  schedule:
    # 每天 09:00（北京时间 UTC+8）= UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-paper-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SKIP_FEISHU_NOTIFY: "true"
        run: python src/main.py

      - name: Commit and push weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p daily_reports weekly_reports data
          git add daily_reports/*.md weekly_reports/*.md data/published_papers.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new or updated report to commit."
          else
            git commit -m "chore: update paper report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Validate Feishu wiki secrets
        if: success()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_WIKI_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_PARENT_NODE_TOKEN }}
          FEISHU_WIKI_BASE_URL: ${{ secrets.FEISHU_WIKI_BASE_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          missing=0
          [ -z "$FEISHU_APP_ID" ] && echo "::error::缺少 Secret: FEISHU_APP_ID" && missing=1
          [ -z "$FEISHU_APP_SECRET" ] && echo "::error::缺少 Secret: FEISHU_APP_SECRET" && missing=1
          if [ -z "$FEISHU_WIKI_SPACE_ID" ] && [ -z "$FEISHU_WIKI_PARENT_NODE_TOKEN" ]; then
            echo "::error::缺少 FEISHU_WIKI_SPACE_ID 或 FEISHU_WIKI_PARENT_NODE_TOKEN（至少填一个）"
            missing=1
          fi
          [ -z "$FEISHU_WEBHOOK_URL" ] && echo "::error::缺少 Secret: FEISHU_WEBHOOK_URL" && missing=1
          if [ "$missing" -ne 0 ]; then exit 1; fi
          python scripts/verify_feishu_wiki.py

      - name: Send report to Feishu
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_WIKI_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_PARENT_NODE_TOKEN }}
          FEISHU_WIKI_BASE_URL: ${{ secrets.FEISHU_WIKI_BASE_URL }}
          FEISHU_NOTIFY_MODE: wiki_link
        run: |
          LATEST=$(ls -t daily_reports/*-文献每日速递*.md 2>/dev/null | head -1 || true)
          if [ -z "$LATEST" ]; then
            echo "daily_reports/ 下无速递文件，跳过飞书推送。"
            exit 0
          fi
          if grep -q "今日无新增文献" "$LATEST"; then
            echo "今日无新增文献，跳过飞书推送。"
            exit 0
          fi
          python src/send_to_feishu.py "$LATEST"
