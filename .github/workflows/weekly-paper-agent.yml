name: Daily Paper Agent

on:
  schedule:
    # 每两天北京时间凌晨 03:12（按 UTC 计算）
    - cron: "12 19 */2 * *"   
  workflow_dispatch:

# 定时任务仅在 main 上执行；避免并发重复推送
concurrency:
  group: daily-paper-agent-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-paper-agent:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      REPORT_TIMEZONE: Asia/Shanghai

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Log schedule trigger time (Beijing)
        if: github.event_name == 'schedule'
        run: |
          echo "定时任务实际启动时间（北京时间）：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "$HOUR" -lt 7 ] || [ "$HOUR" -ge 14 ]; then
            echo "::warning::启动时刻偏离上午 9 点较多（当前 ${HOUR} 点），多为 GitHub 排队延迟，仍继续执行。"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run paper agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          PER_SOURCE_MAX_RESULTS: "30"
          SKIP_FEISHU_NOTIFY: "true"
          PYTHONUNBUFFERED: "1"
          ARXIV_REQUEST_TIMEOUT: "60"
          ARXIV_MAX_RETRIES: "3"
          ARXIV_MIN_REQUEST_INTERVAL: "3.5"
          ARXIV_KEYWORD_DELAY: "8"
          ARXIV_COOLDOWN_SECONDS: "8"
          ARXIV_POST_429_DELAY: "45"
          ARXIV_RETRY_ROUND_COOLDOWN: "90"
          ARXIV_TOTAL_TIMEOUT_SECONDS: "1200"
          ARXIV_BULK_QUERY_MAX_KEYWORDS: "0"
          ARXIV_CONTACT_EMAIL: "peinengzhong@gmail.com"
          SEMANTIC_SCHOLAR_TOTAL_TIMEOUT_SECONDS: "120"
          OPENREVIEW_TOTAL_TIMEOUT_SECONDS: "120"
          SCOPUS_TOTAL_TIMEOUT_SECONDS: "120"
          DEEPSEEK_TIMEOUT: "90"
        run: python3 -u src/main.py

      - name: Commit and push daily report to main
        run: |
          BRANCH="main"

          sync_from_remote() {
            git fetch origin "$BRANCH"
            if git pull --rebase origin "$BRANCH"; then
              return 0
            fi
            echo "Rebase failed, trying merge with origin/$BRANCH..."
            git rebase --abort 2>/dev/null || true
            git pull origin "$BRANCH" --no-edit
          }

          push_with_retry() {
            local attempt=1
            local delay=10
            while true; do
              sync_from_remote
              if git push origin "HEAD:${BRANCH}"; then
                return 0
              fi
              if [ "$attempt" -ge 5 ]; then
                echo "git push failed after $attempt attempts."
                return 1
              fi
              echo "git push failed; pull and retry in ${delay}s (attempt $attempt/5)..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p daily_reports
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          REPORT="daily_reports/${TODAY}-文献每日速递.html"
          if [ ! -f "$REPORT" ]; then
            echo "::error::未找到日报文件 ${REPORT}，无法提交到仓库。"
            exit 1
          fi
          # .gitignore 忽略了日报正文，Actions 需 -f 强制加入暂存区；首页也要一起提交
          git add -f "$REPORT" index.html
          if git diff --cached --quiet; then
            echo "::error::日报已生成但 git 未暂存任何变更，请检查 .gitignore 与 git add。"
            exit 1
          fi
          git commit -m "chore: update daily paper report ${TODAY}"
          push_with_retry

      - name: Send daily report webhook notice
        if: success()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO_BRANCH: main
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          LATEST="daily_reports/${TODAY}-文献每日速递.html"
          if [ ! -f "$LATEST" ]; then
            echo "未找到今日日报 ${LATEST}，跳过飞书推送。"
            exit 0
          fi
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::缺少 Secret: FEISHU_WEBHOOK_URL"
            exit 1
          fi
          PAPER_COUNT=$(grep -c '<section class="paper-card">' "$LATEST" || true)
          python3 src/notify_feishu.py "$LATEST" --paper-count "$PAPER_COUNT"
