<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-08-10-文献每日速递</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --border: #dbe4ee;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, #f5f7fb 30%, #f8fafc 100%);
      color: var(--text);
    }
    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 72px;
    }
    .hero {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(219, 228, 238, 0.9);
      border-radius: 28px;
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    .eyebrow {
      display: inline-block;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.1;
    }
    .hero-meta, .count {
      color: var(--muted);
      margin: 12px 0 0;
      line-height: 1.7;
    }
    .paper-grid {
      display: grid;
      gap: 18px;
    }
    .paper-card {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .paper-index {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      font-size: 24px;
      font-weight: 800;
    }
    .paper-body h2 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.35;
    }
    .meta-list, .links {
      list-style: none;
      padding: 0;
      margin: 0 0 14px;
    }
    .meta-list li {
      display: flex;
      gap: 12px;
      margin: 6px 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta-list span:first-child {
      min-width: 84px;
      color: var(--text);
      font-weight: 600;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 18px;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .summary {
      background: #f8fbff;
      border: 1px solid #d9e6f2;
      border-radius: 18px;
      padding: 16px 18px;
      line-height: 1.8;
    }
    .summary p {
      margin: 0 0 12px;
      white-space: pre-wrap;
    }
    .summary p:last-child {
      margin-bottom: 0;
    }
    .empty {
      color: var(--muted);
    }
    @media (max-width: 720px) {
      .page { padding: 18px 12px 44px; }
      .hero, .paper-card { padding: 18px; border-radius: 20px; }
      .paper-card { grid-template-columns: 1fr; }
      .paper-index { width: 52px; height: 52px; font-size: 20px; }
      .meta-list li { display: block; }
      .meta-list span:first-child { display: block; min-width: 0; margin-bottom: 2px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">Paper Weekly Agent</div>
      <h1>2026-08-10-文献每日速递</h1>
      <p class="hero-meta">生成时间：2026-08-10<br>存档文件：2026-08-10-文献每日速递.html</p>
      <p class="count">今日无新增文献（暂无匹配论文）。</p>
    </header>
    <section class="paper-grid">
      
    </section>
  </main>
</body>
</html>
